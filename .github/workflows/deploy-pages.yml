name: Deploy stable and beta to Pages

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  request-deployment:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Request deployment from main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable channel
        uses: actions/checkout@v4
        with:
          ref: main
          path: channels/stable
      - name: Detect beta channel
        id: beta
        shell: bash
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" beta > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout beta channel
        if: steps.beta.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: channels/beta
      - name: Assemble release channels
        shell: bash
        run: |
          mkdir -p site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            channels/stable/ site/

          mkdir -p site/beta
          if [[ "${{ steps.beta.outputs.exists }}" == "true" ]]; then
            beta_source="channels/beta"
          else
            beta_source="channels/stable"
          fi
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            "$beta_source/" site/beta/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
